aid: leta
name: Leta
description: 'Leta is a pan-African logistics technology company founded in 2022 and
  headquartered in Westlands, Nairobi, Kenya, with operations across Kenya, Nigeria
  and South Africa. Leta builds an AI-driven delivery management platform that helps
  businesses move goods cheaper and faster while minimising climate impact: route optimization,
  automated dispatch and broadcast, live GPS track-and-trace, payment on delivery,
  fleet management, and delivery analytics. The platform is delivered as logistics
  SaaS plus on-demand and dedicated rider services, including an M-PESA business mini-app,
  and serves e-commerce, third-party logistics and courier, food and beverage, retail
  and consumer goods, and pharmacy and healthcare delivery operators. Leta is backed
  by Speedinvest.'
